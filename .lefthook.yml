# Lefthook configuration for pre-commit hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    frontend-format:
      glob: '*.{ts,tsx,js,jsx,json,jsonc,json5,css,md,html,yml,yaml}'
      exclude: 'node_modules|bun.lock|route-tree.gen.ts'
      run: bun run format --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    frontend-lint:
      glob: '*.{ts,tsx,js,jsx}'
      exclude: 'node_modules|route-tree.gen.ts'
      run: bun run lint --no-error-on-unmatched-pattern {staged_files}

    backend-format:
      root: 'src-tauri/'
      glob: '*.rs'
      run: cargo fmt
      stage_fixed: true

    backend-lint:
      root: 'src-tauri/'
      glob: '*.rs'
      run: cargo clippy --all-targets --all-features -- -D warnings
